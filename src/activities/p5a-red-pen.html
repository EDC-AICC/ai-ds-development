<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The red pen — interactive activity</title>
<meta name="description" content="An AI summary of the clinic data, six sentences, every number verifiable. Judge each claim before you see the answers.">
<style>
  :root{
    --paper:#fafbfc; --ink:#1c2733; --slate:#5d6b7a; --line:#dde3e9;
    --accent:#0e7490; --accent-soft:#e3f1f5; --good:#15803d; --good-soft:#e9f5ec;
    --warn:#b45309; --warn-soft:#fdf3e7; --card:#ffffff; --chrome:#f0f3f6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --serif:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
    --sans:"Avenir Next",Avenir,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0; background:transparent}
  body{color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.65}
  .activity{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    max-width:56rem; margin:0 auto; overflow:hidden; box-shadow:0 1px 3px rgba(28,39,51,.06);
  }
  .activity-instructions{
    display:flex; align-items:center; gap:1rem; padding:.7rem .9rem;
    font-size:.92rem; color:var(--slate); border-bottom:1px dashed var(--line); background:var(--card);
  }
  .a-instr{flex:1; min-width:0}
  .a-actions{display:flex; gap:.5rem; flex:none}
  @media (max-width:560px){ .activity-instructions{flex-wrap:wrap} .a-actions{margin-left:auto} }
  .activity-body{padding:1rem .9rem 1.2rem}
  button.btn{
    font-family:var(--sans); font-size:.88rem; font-weight:600;
    border:1px solid var(--accent); color:var(--accent); background:var(--card);
    border-radius:6px; padding:.4rem .85rem; cursor:pointer;
  }
  button.btn:hover{background:var(--accent-soft)}
  button.btn.primary{background:var(--accent); color:#fff}
  button.btn.primary:hover{background:#0c637c}
  button.btn:disabled{opacity:.45; cursor:default}
  button.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .p5a-note{font-family:var(--mono); font-size:.66rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--slate); margin:0 0 .5rem}
  .p5a-s{border:1px solid var(--line); border-radius:8px; padding:.6rem .75rem; margin:0 0 .55rem; background:#fcfdfe}
  .p5a-s .txt{font-size:.92rem; margin:0 0 .45rem}
  .p5a-vbtns{display:flex; gap:.3rem; flex-wrap:wrap}
  .p5a-v{
    font-family:var(--mono); font-size:.66rem; letter-spacing:.04em;
    border:1px solid var(--line); color:var(--slate); background:var(--card);
    border-radius:99px; padding:.18rem .6rem; cursor:pointer;
  }
  .p5a-v:hover{border-color:var(--accent); color:var(--accent)}
  .p5a-v.picked{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700}
  .p5a-v:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .p5a-s.right{border-color:#bfe0c8; background:var(--good-soft)}
  .p5a-s.wrong{border-color:#f0d9b8; background:var(--warn-soft)}
  .p5a-why{font-size:.82rem; color:var(--slate); margin:.45rem 0 0; padding-top:.45rem; border-top:1px dashed var(--line)}
  .p5a-why b{color:var(--ink)}
  .p5a-score{font-size:.85rem; color:var(--slate); border-left:3px solid var(--accent);
    padding:.15rem 0 .15rem .7rem; margin:.4rem 0 0; max-width:38rem}
  .p5a-score b{color:var(--ink)}
</style>
</head>
<body>

<div class="activity" id="p5a">
  <div class="activity-instructions">
    <span class="a-instr">The AI's summary of the clinic data, one sentence at a time.
    <strong>Judge every claim</strong>, then check your review. Supported means your Part 4 numbers
    back the whole sentence, impression included.</span>
    <div class="a-actions">
      <button class="btn primary" id="p5a-check" type="button" disabled>Check my review</button>
    </div>
  </div>
  <div class="activity-body">
    <p class="p5a-note">draft summary · for the clinic director</p>
    <div id="p5a-list"></div>
    <div id="p5a-result"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = (id)=>document.getElementById(id);

  /* Every number is real. The verdicts are about the sentences. */
  const SENTENCES = [
    { t:"The clinic recorded 793 visits from 200 patients between January 2022 and December 2023.",
      truth:"supported",
      why:"<b>Counts, patients, and range all match the file.</b> Quiet verb, no interpretation. This is what a load-bearing sentence looks like." },
    { t:"The most common diagnosis was Essential Hypertension, accounting for 94 visits.",
      truth:"supported",
      why:"<b>Matches your Job 1 table exactly.</b> It states the measurement and stops, which is the whole trick." },
    { t:"Telehealth accounted for 24.7% of visits, demonstrating strong patient demand for virtual care.",
      truth:"misleading",
      why:"<b>The number is yours and the verb is not.</b> 24.7% is correct. <i>Demonstrating demand</i> is a story about why, and a scheduling policy, a provider preference, or a billing rule would produce the same share. The first half of the sentence earns trust the second half spends." },
    { t:"Visit volume peaked in November, driven by seasonal respiratory illness.",
      truth:"unsupported",
      why:"<b>The peak is real, the cause is invented.</b> November leads in both years, so the first clause survives. Nothing in the file links any visit to season or weather, and the diagnosis mix per month was never computed. <i>Driven by</i> is doing unpaid work." },
    { t:"Patient satisfaction remained high throughout the period.",
      truth:"unsupported",
      why:"<b>There is no satisfaction data anywhere in this file.</b> Not a column, not a number, nothing. It is plausible, it flatters the clinic, and it is unfalsifiable from your notebook, which makes it the most dangerous sentence in the draft. A claim you cannot check is a claim you cannot send." },
    { t:"Follow-up was required on 46% of visits.",
      truth:"supported",
      why:"<b>46.2% in your stat block.</b> Rounding to 46% for a director is fine. The receipt exists and the verb is honest." }
  ];
  const OPTS = [["supported","supported"],["misleading","true but misleading"],["unsupported","unsupported"]];
  const picks = new Array(SENTENCES.length).fill(null);
  let checked = false;

  function draw(){
    $("p5a-list").innerHTML = SENTENCES.map((s,i)=>{
      const cls = checked ? (picks[i]===s.truth ? "right" : "wrong") : "";
      return `<div class="p5a-s ${cls}">
        <p class="txt">${s.t}</p>
        <div class="p5a-vbtns">${OPTS.map(([id,label])=>
          `<button type="button" class="p5a-v ${picks[i]===id?'picked':''}" data-i="${i}" data-v="${id}" ${checked?'disabled':''}>${label}</button>`).join("")}
        </div>
        ${checked ? `<p class="p5a-why">${s.why}</p>` : ""}
      </div>`;
    }).join("");
    $("p5a-list").querySelectorAll(".p5a-v").forEach(b=>{
      b.addEventListener("click", ()=>{
        if(checked) return;
        picks[+b.dataset.i] = b.dataset.v;
        draw();
      });
    });
    $("p5a-check").disabled = checked || picks.some(p=>!p);
  }

  function resultHTML(){
    const right = picks.filter((p,i)=>p===SENTENCES[i].truth).length;
    return `<p class="p5a-score"><b>${right} of ${SENTENCES.length} judged the way the data judges them.</b>
      Three sentences deserved to ship, and three carried something your numbers never said. The pattern to
      keep is where the trouble lived. Never in the numbers, always in the verbs and the claims beside them.
      That is what the fact-check in Notebook 4 walks sentence by sentence.</p>`;
  }

  $("p5a-check").addEventListener("click", ()=>{
    if(picks.some(p=>!p)) return;
    checked = true;
    draw();
    $("p5a-result").innerHTML = resultHTML();
  });

  /* Reserve the checked-state height so the reveal never resizes the activity. */
  function lockHeight(){
    if(!document.body.clientWidth){ requestAnimationFrame(lockHeight); return; }
    const list = $("p5a-list"), res = $("p5a-result");
    const keepChecked = checked, keepL = list.innerHTML, keepR = res.innerHTML;
    checked = true;
    draw();
    res.innerHTML = resultHTML();
    const tl = list.scrollHeight, tr = res.scrollHeight;
    checked = keepChecked;
    list.innerHTML = keepL; res.innerHTML = keepR;
    draw();
    list.style.minHeight = (tl + 6) + "px"; res.style.minHeight = (tr + 8) + "px";
  }

  draw(); lockHeight();
  let rt;
  window.addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(lockHeight, 120); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(lockHeight);
})();
</script>

<script>
/* Embed helper: reports the activity's height so the parent page can size the frame. */
(function(){
  "use strict";
  if(window.parent === window) return;
  const card = document.querySelector(".activity");
  let last = 0;
  function post(){
    const h = Math.ceil(card.getBoundingClientRect().height);
    if(h === last) return;
    last = h;
    window.parent.postMessage({type:"activity-height", id:"p5a-red-pen", height:h}, "*");
  }
  window.addEventListener("load", post);
  window.addEventListener("resize", post);
  window.addEventListener("message", function(e){
    if(e.data && e.data.type === "activity-height-request"){ last = 0; post(); }
  });
  if(window.ResizeObserver) new ResizeObserver(post).observe(card);
  /* settle-timers: fonts and late reflows can land after every event above,
     so post a few extra times; the last===h guard keeps it quiet. */
  [700, 1600, 3200, 5000].forEach(function(ms){ setTimeout(post, ms); });
  document.addEventListener("click", ()=>setTimeout(post, 0));
  post();
})();
</script>

</body>
</html>
