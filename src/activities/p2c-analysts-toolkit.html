<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The analyst's toolkit — interactive activity</title>
<meta name="description" content="The real 812-row clinic file and the five checks an analyst runs on a new file. Six defects are in there. Find them.">
<style>
  :root{
    --paper:#fafbfc; --ink:#1c2733; --slate:#5d6b7a; --line:#dde3e9;
    --accent:#0e7490; --accent-soft:#e3f1f5; --good:#15803d; --good-soft:#e9f5ec;
    --warn:#b45309; --warn-soft:#fdf3e7; --card:#ffffff; --chrome:#f0f3f6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --serif:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
    --sans:"Avenir Next",Avenir,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0; background:transparent}
  body{color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.65}
  .activity{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    max-width:56rem; margin:0 auto; overflow:hidden; box-shadow:0 1px 3px rgba(28,39,51,.06);
  }
  .activity-instructions{
    display:flex; align-items:center; gap:1rem; padding:.7rem .9rem;
    font-size:.92rem; color:var(--slate); border-bottom:1px dashed var(--line); background:var(--card);
  }
  .a-instr{flex:1; min-width:0}
  .activity-body{padding:1rem .9rem 1.2rem}

  .p2c-h{
    font-family:var(--mono); font-size:.68rem; letter-spacing:.13em; text-transform:uppercase;
    font-weight:600; color:var(--slate); margin:1.1rem 0 .4rem;
  }
  .p2c-h:first-child{margin-top:0}
  .p2c-h b{color:var(--ink); font-weight:700; letter-spacing:.06em}

  .p2c-finds{display:flex; flex-wrap:wrap; gap:.35rem; margin:0}
  .p2c-find{
    font-family:var(--mono); font-size:.66rem; letter-spacing:.03em;
    border:1px solid var(--line); border-radius:99px; padding:.2rem .6rem; color:var(--slate);
  }
  .p2c-find.got{border-color:var(--good); color:var(--good); background:var(--good-soft); font-weight:700}
  .p2c-find.got::before{content:"✓ "}

  .p2c-toolrow{display:flex; flex-wrap:wrap; gap:.35rem; margin:0 0 .5rem}
  .p2c-tool{
    font-family:var(--sans); font-size:.8rem; font-weight:600;
    border:1px solid var(--accent); color:var(--accent); background:var(--card);
    border-radius:6px; padding:.32rem .7rem; cursor:pointer;
  }
  .p2c-tool:hover{background:var(--accent-soft)}
  .p2c-tool.active{background:var(--accent); color:#fff}
  .p2c-tool:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .p2c-colrow{display:flex; flex-wrap:wrap; gap:.3rem; margin:0; align-items:center}
  .p2c-collabel{font-family:var(--mono); font-size:.66rem; color:var(--slate); margin-right:.2rem}
  .p2c-col{
    font-family:var(--mono); font-size:.68rem; border:1px solid var(--line); border-radius:99px;
    padding:.18rem .6rem; color:var(--slate); background:var(--card); cursor:pointer;
  }
  .p2c-col:hover{border-color:var(--accent); color:var(--accent)}
  .p2c-col.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700}
  .p2c-col:disabled{opacity:.4; cursor:default}
  .p2c-col:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .p2c-out{
    border:1px solid var(--line); border-radius:8px; background:#fcfdfe;
    font-family:var(--mono); font-size:.72rem; line-height:1.55;
    padding:.7rem .85rem; overflow:auto; white-space:pre;
  }
  .p2c-out .hit{color:var(--warn); font-weight:700}
  .p2c-note{font-size:.85rem; font-family:var(--sans); color:var(--slate);
    border-left:3px solid var(--accent); padding:.15rem 0 .15rem .7rem; margin:.7rem 0 0; white-space:normal}
  .p2c-note b{color:var(--ink)}
</style>
</head>
<body>

<div class="activity" id="p2c">
  <div class="activity-instructions">
    <span class="a-instr">The real clinic file, all 812 rows, and the five checks every analyst runs.
    <strong>Six defects are in this data.</strong> Pick a tool, pick a column where it wants one, and
    find all six.</span>
  </div>
  <div class="activity-body">
    <p class="p2c-h">Tool</p>
    <div class="p2c-toolrow" id="p2c-tools"></div>
    <div class="p2c-colrow" id="p2c-cols"></div>
    <p class="p2c-h">Output</p>
    <div class="p2c-out" id="p2c-out">Pick a tool to start. Show rows is where most people begin.</div>
    <p class="p2c-h" id="p2c-findshead">Defects <b>0 of 6</b></p>
    <div class="p2c-finds" id="p2c-finds"></div>
  </div>
</div>

,26,40,25,5,"",56,-30,28,60,181,38,22,5,0,60,50,22,193,23,26,5,0,36,159,0,"",5,0,43,-18,19,57,135,21,0,5,31,0,57,0,17,183,0,40,108,5,0,36,26,189,26,"",22,29,0,"","",121,189,51,5,0,45,"",0,22,23,"",0,198,5,5,5,200,0,"",60,16,0,5,0,0,0,0,5,24,5,24,18,28,58,0,142,190,54,"",101,41,110,5,0,50,43,59,60,0,46,58,21,0,144,146,50,5,"",0,37,18,"",28,55,199,20,39,5,26,5,0,0,44,27,"",36,40,28,116,5,20,44,43,0,5,58,38,47,28,"",0,195,55,-46,57,38,26,0,37,0,53,0,117,27,40,39,34,82,24,40,37,46,20,0,120,5,"",-18,0,0,5,162,"",5,41,22,0,29,5,21,5,31,5,0,0,170,18,5,65,0,60,5,20,0,"",179,170,"",0,40,195,28,92,5,20,26,0,85,0,0,31,116,5,39,48,35,"",35,0,21,36,142,72,39,5,31,28,178,43,77,0,5,0,58,24,5,18,0,"",98,57,32,24,38,68,21,36,34,0,0,24,46,0,54,0,0,34,197,24,0,"",19,0,34,5,0,0,-32,33,21,0,22,0,28,0,0,0,182,24,88,67,"",0,0,0,42,0,0,52,"",0,37,0,24,5,47,0,0,0,0,21,19,94,199,0,39,26,21,-27,64,25,58,24]};
  const N = D.visit_id.length;
  const COLS = ["visit_date","gender","age","insurance_type","county","copay_amount"];

  const FINDS = [
    {id:"dup",   label:"a visit entered twice"},
    {id:"date",  label:"a value that is not a date"},
    {id:"age",   label:"an age no human has"},
    {id:"copay", label:"money flowing backward"},
    {id:"county",label:"the counties that are not there"},
    {id:"spell", label:"one category, many spellings"}
  ];
  const got = new Set();

  const TOOLS = [
    {id:"rows",  label:"Show rows",         needsCol:false},
    {id:"count", label:"Count a column",    needsCol:true},
    {id:"miss",  label:"Missing per column",needsCol:false},
    {id:"minmax",label:"Smallest & largest",needsCol:true},
    {id:"dups",  label:"Duplicate check",   needsCol:false}
  ];
  let tool = null, col = null;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function pad(s,w){ s=String(s); return s.length>=w ? s.slice(0,w) : s+" ".repeat(w-s.length); }

  function mark(id, note){
    if(!got.has(id)){ got.add(id); drawFinds(); }
    return note;
  }
  function drawFinds(){
    $("p2c-findshead").innerHTML = `Defects <b>${got.size} of ${FINDS.length}</b>`;
    $("p2c-finds").innerHTML = FINDS.map(f=>
      `<span class="p2c-find ${got.has(f.id)?'got':''}">${f.label}</span>`).join("");
  }

  function showRows(){
    const start = Math.floor(Math.random()*(N-10));
    let out = pad("",4)+COLS.map(c=>pad(c,14)).join("")+"\n";
    for(let i=start;i<start+10;i++){
      out += pad(i,4)+COLS.map(c=>pad(esc(D[c][i]===""?"·":D[c][i]),14)).join("")+"\n";
    }
    return {text: out, note: `Rows ${start} to ${start+9} of ${N}. Ten rows at a time is how everyone starts, and it is a keyhole. Run it a few times, then try a tool that sees the whole file at once.`};
  }

  function countCol(c){
    const counts = {};
    D[c].forEach(v=>{ const k = v===""?"(missing)":v; counts[k]=(counts[k]||0)+1; });
    const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    let out = `value_counts: ${c}  ·  ${entries.length} distinct values\n\n`;
    entries.slice(0,8).forEach(([k,v])=>{ out += pad(esc(k),22)+v+"\n"; });
    if(entries.length>8) out += `… and ${entries.length-8} more values\n`;
    let note = `${entries.length} distinct values in ${c}.`;
    if(c==="gender") note = mark("spell", `<b>14 distinct values where 3 categories should be.</b> female, F, f, Female, and FEMALE are five different answers to a computer. This is the census the ten-row view can never show you.`);
    if(c==="insurance_type") note = mark("spell", `<b>18 distinct values where 4 categories should be.</b> And some merges need clinic knowledge. Whether Commercial belongs with Private is a question for a person, and the AI that cleans this will guess unless you decide.`);
    if(c==="visit_date") note = `Nearly every date is distinct, so counting values tells you little here. Dates need a different check. Try Smallest & largest.`;
    if(c==="county") note = `Eight real counties and one value that is not a county at all. (missing) is absence wearing a label. Missing per column measures it properly.`;
    return {text: out, note};
  }

  function missing(){
    const cols = ["visit_id","patient_id",...COLS];
    let out = "missing values per column\n\n";
    cols.forEach(c=>{
      const m = D[c].filter(v=>v==="").length;
      out += pad(c,16)+pad(m,6)+(m? (m/N*100).toFixed(1)+"%":"")+"\n";
    });
    return {text: out, note: mark("county", `<b>248 county values are missing. Nearly a third of the file.</b> Age and copay have gaps too. Where the gaps fall, and whether they fall evenly, turns out to be one of the most important questions you can ask this data. Part 4 asks it.`)};
  }

  function minmax(c){
    if(c==="age"||c==="copay_amount"){
      const vals = D[c].filter(v=>v!=="").map(Number);
      const mn = Math.min(...vals), mx = Math.max(...vals);
      let out = `smallest & largest: ${c}\n\n  min  ${mn}\n  max  ${mx}\n`;
      if(c==="age") return {text:out, note: mark("age", `<b>The youngest patient is -5 and the oldest is 999.</b> Ten rows carry an impossible age. describe() would have shown you this minimum and maximum on day one, which is why analysts read min and max before they trust a single average.`)};
      return {text:out, note: mark("copay", `<b>The smallest copay is -$127.</b> Fourteen visits charged negative money. A slip, or a refund coded into the wrong column. The data cannot say which, and the fix depends on the answer.`)};
    }
    const vals = D[c].filter(v=>v!=="").map(String);
    const mn = vals.reduce((a,b)=>a<b?a:b), mx = vals.reduce((a,b)=>a>b?a:b);
    let out = `smallest & largest: ${c}  (text sorts as text)\n\n  min  ${esc(mn)}\n  max  ${esc(mx)}\n`;
    let note = `Text columns sort alphabetically, which is rarely what you want, and occasionally exactly what you need.`;
    if(c==="visit_date") note = mark("date", `<b>The largest visit_date is "not recorded".</b> Sorting text puts letters after digits, so the misfits float to the end. An old trick, and it just found a value in the date column that is not a date. There is another one. Feb 30 2023, a date that has never existed.`);
    return {text: out, note};
  }

  function dups(){
    const seen = new Map(); let pairs = [];
    for(let i=0;i<N;i++){
      const key = ["visit_id","patient_id",...COLS].map(c=>D[c][i]).join("|");
      if(seen.has(key)) pairs.push([seen.get(key), i]); else seen.set(key, i);
    }
    let out = `exact duplicate rows: ${pairs.length}\n\n`;
    pairs.slice(0,5).forEach(([a,b])=>{
      out += `rows ${a} and ${b}  ·  ${D.visit_id[a]}  ${D.patient_id[a]}  ${esc(D.visit_date[a])}\n`;
    });
    if(pairs.length>5) out += `… and ${pairs.length-5} more pairs\n`;
    return {text: out, note: mark("dup", `<b>Fifteen visits were entered twice,</b> down to the visit_id that is supposed to be unique. Every count in this file is inflated by 15 until they go. You could scroll this file for an hour and never see one, because a duplicate only looks wrong next to its twin.`)};
  }

  function run(){
    if(!tool) return;
    const t = TOOLS.find(x=>x.id===tool);
    if(t.needsCol && !col){ $("p2c-out").innerHTML = "This tool works one column at a time. Pick a column."; return; }
    let r;
    if(tool==="rows") r = showRows();
    if(tool==="count") r = countCol(col);
    if(tool==="miss") r = missing();
    if(tool==="minmax") r = minmax(col);
    if(tool==="dups") r = dups();
    $("p2c-out").innerHTML = esc0(r.text) + (r.note?`<div class="p2c-note">${r.note}</div>`:"");
    if(got.size===FINDS.length && !run.doneShown){
      run.doneShown = true;
      $("p2c-out").innerHTML += `<div class="p2c-note"><b>All six found.</b> Notice what found them. Rows found none. Every defect fell to a count, a min, a max, or a missing-value tally, and each check took one click. In the notebook you will ask an AI to run exactly these checks on this exact file.</div>`;
    }
  }
  function esc0(s){ return s.replace(/&(?!amp;|lt;)/g,"&amp;"); }

  function drawTools(){
    $("p2c-tools").innerHTML = TOOLS.map(t=>
      `<button type="button" class="p2c-tool ${tool===t.id?'active':''}" data-t="${t.id}">${t.label}</button>`).join("");
    $("p2c-tools").querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{ tool = b.dataset.t; drawTools(); drawCols(); run(); });
    });
  }
  function drawCols(){
    const t = TOOLS.find(x=>x.id===tool);
    const on = t && t.needsCol;
    /* Hidden rather than removed, so switching tools never reflows the card. */
    $("p2c-cols").style.visibility = on ? "visible" : "hidden";
    $("p2c-cols").innerHTML = `<span class="p2c-collabel">column</span>` + COLS.map(c=>
      `<button type="button" class="p2c-col ${col===c?'active':''}" data-c="${c}" ${on?"":"disabled"}>${c}</button>`).join("");
    $("p2c-cols").querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{ col = b.dataset.c; drawCols(); run(); });
    });
  }

  drawFinds(); drawTools(); drawCols();

  /* Reserve the tallest output so tool-hopping never resizes the activity. */
  function lockHeight(){
    if(!document.body.clientWidth){ requestAnimationFrame(lockHeight); return; }
    const out = $("p2c-out");
    const keep = out.innerHTML;
    out.style.minHeight = "0";
    let tallest = 0;
    const samples = [countCol("insurance_type"), missing(), dups(), minmax("age"), showRows()];
    samples.forEach(r=>{
      out.innerHTML = esc0(r.text)+(r.note?`<div class="p2c-note">${r.note} extra line for the all-found banner that appends here.</div>`:"");
      tallest = Math.max(tallest, out.scrollHeight);
    });
    got.clear(); run.doneShown = false; drawFinds();
    out.innerHTML = keep;
    out.style.minHeight = tallest + "px";
  }
  lockHeight();
  let rt;
  window.addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(lockHeight, 120); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(lockHeight);
})();
</script>

  }
  window.addEventListener("load", post);
  window.addEventListener("resize", post);
  window.addEventListener("message", function(e){
    if(e.data && e.data.type === "activity-height-request"){ last = 0; post(); }
  });
  if(window.ResizeObserver) new ResizeObserver(post).observe(card);
  /* settle-timers: fonts and late reflows can land after every event above,
     so post a few extra times; the last===h guard keeps it quiet. */
  [700, 1600, 3200, 5000].forEach(function(ms){ setTimeout(post, ms); });
  document.addEventListener("click", ()=>setTimeout(post, 0));
  post();
})();
</script>
