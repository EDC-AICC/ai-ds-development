<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyes don't scale — interactive activity</title>
<meta name="description" content="All 812 rows fly past. Catch the problems if you can. Then count instead.">
<style>
  :root{
    --paper:#fafbfc; --ink:#1c2733; --slate:#5d6b7a; --line:#dde3e9;
    --accent:#0e7490; --accent-soft:#e3f1f5; --good:#15803d; --good-soft:#e9f5ec;
    --warn:#b45309; --warn-soft:#fdf3e7; --card:#ffffff; --chrome:#f0f3f6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --serif:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
    --sans:"Avenir Next",Avenir,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0; background:transparent}
  body{color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.65}
  .activity{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    max-width:56rem; margin:0 auto; overflow:hidden; box-shadow:0 1px 3px rgba(28,39,51,.06);
  }
  .activity-instructions{
    display:flex; align-items:center; gap:1rem; padding:.7rem .9rem;
    font-size:.92rem; color:var(--slate); border-bottom:1px dashed var(--line); background:var(--card);
  }
  .a-instr{flex:1; min-width:0}
  .a-actions{display:flex; gap:.5rem; flex:none}
  @media (max-width:560px){ .activity-instructions{flex-wrap:wrap} .a-actions{margin-left:auto} }
  .activity-body{padding:1rem .9rem 1.2rem}
  button.btn{
    font-family:var(--sans); font-size:.88rem; font-weight:600;
    border:1px solid var(--accent); color:var(--accent); background:var(--card);
    border-radius:6px; padding:.4rem .85rem; cursor:pointer;
  }
  button.btn:hover{background:var(--accent-soft)}
  button.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button.btn.primary{background:var(--accent); color:#fff}
  button.btn.primary:hover{background:#0c637c}
  button.btn:disabled{opacity:.45; cursor:default}

  .p2b-meta{display:flex; align-items:center; gap:.8rem; margin:0 0 .55rem;
    font-family:var(--mono); font-size:.72rem; color:var(--slate)}
  .p2b-meta b{color:var(--ink)}
  .p2b-track{flex:1; height:5px; background:var(--chrome); border-radius:3px; overflow:hidden}
  .p2b-fill{height:100%; width:0%; background:var(--accent)}

  .p2b-stream{border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative;
    font-family:var(--mono); font-size:.7rem; background:#fcfdfe}
  .p2b-head{display:flex; background:var(--chrome); border-bottom:1px solid var(--line); font-weight:600}
  .p2b-row{display:flex; cursor:pointer; border-bottom:1px solid #eef2f5; user-select:none}
  .p2b-row:hover{background:var(--accent-soft)}
  .p2b-row.flagged{background:var(--warn-soft)}
  .p2b-cell{padding:.2rem .45rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .c0{width:14%} .c1{width:22%} .c2{width:20%} .c3{width:10%} .c4{width:22%} .c5{width:12%}
  .p2b-win{height:16.8em; overflow:hidden}

  .p2b-report{margin-top:.9rem}
  .p2b-report h4{font-family:var(--serif); font-size:1rem; margin:0 0 .55rem}
  .p2b-report p{font-size:.9rem; margin:0 0 .8rem; max-width:38rem}
  .p2b-bars{margin:0 0 .8rem}
  .p2b-bar{display:flex; align-items:center; gap:.5rem; margin:.2rem 0}
  .p2b-bar .lbl{font-family:var(--mono); font-size:.72rem; width:11.5rem; flex:none; color:var(--ink)}
  .p2b-bar .bar{height:.72rem; background:#d97742; border-radius:2px; min-width:2px}
  .p2b-bar.soft .bar{background:#8bb8c6}
  .p2b-bar .val{font-family:var(--mono); font-size:.72rem; color:var(--slate)}
  .p2b-verdict{font-size:.85rem; color:var(--slate); border-left:3px solid var(--accent); padding:.15rem 0 .15rem .7rem; max-width:36rem}
  .p2b-verdict b{color:var(--ink)}
  @media (max-width:560px){ .c3{display:none} .c0{width:16%} .c5{width:14%} }
</style>
</head>

      could catch on sight. Here is what one counting pass finds in under a second.</p>
      <div class="p2b-bars">
        <div class="p2b-bar"><span class="lbl">impossible ages (-5, 999)</span><div class="bar" style="width:8%"></div><span class="val">10 rows</span></div>
        <div class="p2b-bar"><span class="lbl">negative copays</span><div class="bar" style="width:11%"></div><span class="val">14 rows</span></div>
        <div class="p2b-bar"><span class="lbl">values that are not dates</span><div class="bar" style="width:3%"></div><span class="val">2 rows</span></div>
        <div class="p2b-bar soft"><span class="lbl">exact duplicate rows</span><div class="bar" style="width:12%"></div><span class="val">15 rows</span></div>
        <div class="p2b-bar soft"><span class="lbl">missing county</span><div class="bar" style="width:52%"></div><span class="val">248 rows</span></div>
        <div class="p2b-bar soft"><span class="lbl">spellings of gender</span><div class="bar" style="width:11%"></div><span class="val">14 variants</span></div>
        <div class="p2b-bar soft"><span class="lbl">spellings of insurance</span><div class="bar" style="width:14%"></div><span class="val">18 variants</span></div>
      </div>
      <p class="p2b-verdict"><b>The blue rows were invisible on principle.</b> A duplicate looks like
      an ordinary row unless its twin is on screen at the same moment. A missing county is an empty
      cell you would have to notice not seeing. And no amount of staring reveals that gender is
      spelled 14 ways, because each row shows you one of them. Scrolling finds the defects that
      glow. Counting finds them all.</p>`;
  }

  function reveal(){
    if(done) return;
    done = true;
    stop();
    const hits = [...flags].filter(i=>DATA[i][6]).length;
    const seenShare = Math.round(Math.min(pos+VISIBLE, DATA.length)/DATA.length*100);
    $("p2b-count").disabled = true;
    $("p2b-go").disabled = true;
    $("p2b-go").textContent = "Stream ended";
    $("p2b-report").innerHTML = revealHTML(flags.size, hits, seenShare);
  }

  $("p2b-go").addEventListener("click", ()=>{
    if(timer) return;
    $("p2b-go").textContent = "Streaming…";
    $("p2b-go").disabled = true;
    $("p2b-count").disabled = false;
    timer = setInterval(tick, TICK_MS);
  });
  $("p2b-count").addEventListener("click", reveal);

  draw();

  /* Reserve the report's height so the reveal does not resize the activity. */
  function lockHeight(){
    if(!document.body.clientWidth){ requestAnimationFrame(lockHeight); return; }
    const rep = $("p2b-report");
    const keep = rep.innerHTML;
    rep.style.minHeight = "0";
    rep.innerHTML = revealHTML(888, 888, 100);
    const h = rep.scrollHeight;
    rep.innerHTML = done ? keep
      : `<p class="p2b-verdict">The count appears here when you are done watching.</p>`;
    rep.style.minHeight = h + "px";
  }
  lockHeight();
  let rt;
  window.addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(lockHeight, 120); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(lockHeight);
})();
</script>

<script>
/* Embed helper: reports the activity's height so the parent page can size the frame. */
(function(){
  "use strict";
  if(window.parent === window) return;
  const card = document.querySelector(".activity");
  let last = 0;
  function post(){
    const h = Math.ceil(card.getBoundingClientRect().height);
    if(h === last) return;
    last = h;
    window.parent.postMessage({type:"activity-height", id:"p2b-eyes-dont-scale", height:h}, "*");
  }
  window.addEventListener("load", post);
  window.addEventListener("resize", post);
  window.addEventListener("message", function(e){
    if(e.data && e.data.type === "activity-height-request"){ last = 0; post(); }
  });
  if(window.ResizeObserver) new ResizeObserver(post).observe(card);
  /* settle-timers: fonts and late reflows can land after every event above,
     so post a few extra times; the last===h guard keeps it quiet. */
  [700, 1600, 3200, 5000].forEach(function(ms){ setTimeout(post, ms); });
  document.addEventListener("click", ()=>setTimeout(post, 0));
  post();
})();
</script>
