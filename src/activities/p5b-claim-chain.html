<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The claim chain — interactive activity</title>
<meta name="description" content="Tap each sentence of the summary and watch which numbers light up behind it. One sentence lights nothing.">
<style>
  :root{
    --paper:#fafbfc; --ink:#1c2733; --slate:#5d6b7a; --line:#dde3e9;
    --accent:#0e7490; --accent-soft:#e3f1f5; --good:#15803d; --good-soft:#e9f5ec;
    --warn:#b45309; --warn-soft:#fdf3e7; --card:#ffffff; --chrome:#f0f3f6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --serif:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
    --sans:"Avenir Next",Avenir,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0; background:transparent}
  body{color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.65}
  .activity{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    max-width:56rem; margin:0 auto; overflow:hidden; box-shadow:0 1px 3px rgba(28,39,51,.06);
  }
  .activity-instructions{
    display:flex; align-items:center; gap:1rem; padding:.7rem .9rem;
    font-size:.92rem; color:var(--slate); border-bottom:1px dashed var(--line); background:var(--card);
  }
  .a-instr{flex:1; min-width:0}
  .activity-body{padding:1rem .9rem 1.2rem}

  .p5b-receipts{display:flex; flex-wrap:wrap; gap:.3rem; margin:0 0 1rem}
  .p5b-r{
    font-family:var(--mono); font-size:.68rem; border:1px solid var(--line); border-radius:99px;
    padding:.18rem .6rem; color:var(--slate); background:var(--card); transition:all .15s;
  }
  .p5b-r.lit{border-color:var(--good); background:var(--good-soft); color:var(--good); font-weight:700}
  .p5b-rlabel{font-family:var(--mono); font-size:.66rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--slate); margin:0 0 .35rem}
  .p5b-s{
    border:1px solid var(--line); border-left:3px solid var(--line); border-radius:8px;
    padding:.55rem .75rem; margin:0 0 .5rem; background:#fcfdfe; cursor:pointer; font-size:.92rem;
  }
  .p5b-s:hover{border-color:var(--accent)}
  .p5b-s.sel{border-left-color:var(--accent); background:var(--accent-soft)}
  .p5b-s.sel.orphan{border-left-color:var(--warn); background:var(--warn-soft)}
  .p5b-s:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .p5b-verdict{font-size:.85rem; color:var(--slate); border-left:3px solid var(--accent);
    padding:.15rem 0 .15rem .7rem; margin:.6rem 0 0; max-width:38rem}
  .p5b-verdict b{color:var(--ink)}
</style>
</head>
<body>

<div class="activity" id="p5b">
  <div class="activity-instructions">
    <span class="a-instr">Five sentences from a summary, and the stat block they were written from.
    <strong>Tap each sentence</strong> to light up the numbers that back it.</span>
  </div>
  <div class="activity-body">
    <p class="p5b-rlabel">the stat block · everything the analyst verified</p>
    <div class="p5b-receipts" id="p5b-receipts"></div>
    <p class="p5b-rlabel">the summary</p>
    <div id="p5b-sentences"></div>
    <p class="p5b-verdict" id="p5b-verdict">Tap a sentence. A sentence you can trust lights at least one number.</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = (id)=>document.getElementById(id);

  const RECEIPTS = ["793 visits","200 patients","2022 to 2023","Hypertension 94","follow-up 46.2%","telehealth 24.7%","avg copay $37.19","county missing 30.5%"];
  const SENTENCES = [
    {t:"The clinic saw 793 visits from 200 patients over the two years.", r:[0,1,2],
     v:"<b>Three receipts, one sentence.</b> Every part of it points at a number the analyst produced."},
    {t:"Essential Hypertension was the most common diagnosis, with 94 visits.", r:[3],
     v:"<b>One claim, one receipt.</b> The shape to aim for."},
    {t:"Follow-up was required on 46% of visits, and a quarter of visits happened by telehealth.", r:[4,5],
     v:"<b>Two claims sharing a sentence, each with its own receipt.</b> Fine, as long as both light up. A sentence is checked when every claim in it is, and claims do not vouch for their neighbors."},
    {t:"County-level findings should be read with caution, since 30.5% of visits have no county recorded.", r:[7],
     v:"<b>The limitation has a receipt too.</b> A good caveat is a measurement, and this one is the most important number in the file for anyone about to act on a county breakdown."},
    {t:"Patients report high satisfaction with the clinic's services.", r:[], orphan:true,
     v:"<b>Nothing lights up, because nothing exists.</b> There is no satisfaction data in the file, and this sentence reads as well as the other four. That is the point. Unsupported claims borrow their neighbors' credibility, and the only defense is doing exactly what you just did, asking every sentence to point at its receipt."}
  ];
  let sel = null;

  function draw(){
    const lit = sel===null ? new Set() : new Set(SENTENCES[sel].r);
    $("p5b-receipts").innerHTML = RECEIPTS.map((r,i)=>
      `<span class="p5b-r ${lit.has(i)?'lit':''}">${r}</span>`).join("");
    $("p5b-sentences").innerHTML = SENTENCES.map((s,i)=>
      `<div class="p5b-s ${sel===i?'sel':''} ${s.orphan?'orphan':''}" data-i="${i}" tabindex="0" role="button">${s.t}</div>`).join("");
    $("p5b-sentences").querySelectorAll(".p5b-s").forEach(el=>{
      const pick = ()=>{ sel = +el.dataset.i; draw(); };
      el.addEventListener("click", pick);
      el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } });
    });
    $("p5b-verdict").innerHTML = sel===null
      ? "Tap a sentence. A sentence you can trust lights at least one number."
      : SENTENCES[sel].v;
  }

  function lockHeight(){
    if(!document.body.clientWidth){ requestAnimationFrame(lockHeight); return; }
    const v = $("p5b-verdict");
    const keep = v.innerHTML;
    v.style.minHeight = "0";
    let tallest = 0;
    SENTENCES.forEach(s=>{ v.innerHTML = s.v; tallest = Math.max(tallest, v.scrollHeight); });
    v.innerHTML = keep;
    v.style.minHeight = tallest + "px";
  }

  draw(); lockHeight();
  let rt;
  window.addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(lockHeight, 120); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(lockHeight);
})();
</script>

<script>
/* Embed helper: reports the activity's height so the parent page can size the frame. */
(function(){
  "use strict";
  if(window.parent === window) return;
  const card = document.querySelector(".activity");
  let last = 0;
  function post(){
    const h = Math.ceil(card.getBoundingClientRect().height);
    if(h === last) return;
    last = h;
    window.parent.postMessage({type:"activity-height", id:"p5b-claim-chain", height:h}, "*");
  }
  window.addEventListener("load", post);
  window.addEventListener("resize", post);
  window.addEventListener("message", function(e){
    if(e.data && e.data.type === "activity-height-request"){ last = 0; post(); }
  });
  if(window.ResizeObserver) new ResizeObserver(post).observe(card);
  /* settle-timers: fonts and late reflows can land after every event above,
     so post a few extra times; the last===h guard keeps it quiet. */
  [700, 1600, 3200, 5000].forEach(function(ms){ setTimeout(post, ms); });
  document.addEventListener("click", ()=>setTimeout(post, 0));
  post();
})();
</script>

</body>
</html>
