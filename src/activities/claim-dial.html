<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The claim dial — interactive activity</title>
<meta name="description" content="Three verified findings, each a dial from saying nothing to saying too much. Set each one where you would sign your name.">
<link rel="stylesheet" href="../assets/activity/base.css">
<style>
  body{color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.65}
  .activity{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    max-width:56rem; margin:0 auto; overflow:hidden; box-shadow:0 1px 3px rgba(28,39,51,.06);
  }
  .activity-instructions{
    display:flex; align-items:center; gap:1rem; padding:.7rem .9rem;
    font-size:.92rem; color:var(--slate); border-bottom:1px dashed var(--line); background:var(--card);
  }
  .a-instr{flex:1; min-width:0}
  .activity-body{padding:1rem .9rem 1.2rem}
  button.btn{
    font-family:var(--sans); font-size:.88rem; font-weight:600;
    border:1px solid var(--accent); color:var(--accent); background:var(--card);
    border-radius:6px; padding:.4rem .85rem; cursor:pointer;
  }
  button.btn:hover{background:var(--accent-soft)}
  button.btn.primary{background:var(--accent); color:#fff}
  button.btn.primary:hover{background:#0c637c}
  button.btn:disabled{opacity:.45; cursor:default}
  button.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .cd-stephead{display:flex; align-items:center; gap:1rem; margin:0 0 .7rem}
  .cd-stephead .lead{flex:1; min-width:0}
  .cd-step{font-family:var(--mono); font-size:.66rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--accent); margin:0 0 .15rem}
  .cd-stepnote{font-size:.85rem; color:var(--slate); margin:0}
  .cd-stepnote b{color:var(--ink); font-weight:600}
  .cd-stephead .btn{flex:none}
  @media (max-width:560px){ .cd-stephead{flex-wrap:wrap} .cd-stephead .btn{margin-left:auto} }

  .cd-prog{display:flex; gap:.4rem; flex:none; align-items:center}
  .cd-pdot{width:.6rem; height:.6rem; border-radius:99px; border:1.5px solid var(--line); background:#fff}
  .cd-pdot.done{background:var(--accent); border-color:var(--accent)}
  .cd-pdot.now{border-color:var(--accent)}

  /* Evidence */
  .cd-ev{border:1px solid var(--line); border-radius:8px; background:var(--paper); padding:.55rem .75rem .6rem; margin:0 0 .9rem}
  .cd-evh{font-family:var(--mono); font-size:.62rem; letter-spacing:.09em; text-transform:uppercase; color:var(--slate); margin:0 0 .3rem}
  .cd-evgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 1.1rem}
  @media (max-width:520px){ .cd-evgrid{grid-template-columns:1fr} }
  .cd-evcol h4{font-family:var(--mono); font-size:.6rem; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
    margin:.25rem 0 .1rem; color:var(--good)}
  .cd-evcol.not h4{color:var(--warn)}
  .cd-evcol ul{list-style:none; margin:0; padding:0}
  .cd-evcol li{font-size:.8rem; line-height:1.45; color:var(--slate); padding:.18rem 0; border-top:1px dashed var(--line)}
  .cd-evcol li b{font-family:var(--mono); font-size:.78rem; color:var(--ink)}

  /* The sentence */
  .cd-sent{display:grid; border:1px solid var(--line); border-radius:8px; background:#fff;
    padding:.75rem .95rem; margin:0 0 .3rem; position:relative}
  .cd-sent::before{content:"The sentence"; font-family:var(--mono); font-size:.58rem; letter-spacing:.09em;
    text-transform:uppercase; color:var(--slate); position:absolute; top:-.55rem; left:.7rem; background:#fff; padding:0 .3rem}
  .cd-s{grid-area:1/1; font-family:var(--serif); font-size:1.08rem; line-height:1.55; margin:0;
    opacity:0; visibility:hidden; transition:opacity .25s}
  .cd-s.on{opacity:1; visibility:visible}

  /* The dial */
  .cd-dial{margin:.4rem 0 0; padding:.2rem 0 0}
  .cd-track{position:relative; display:grid; grid-template-columns:repeat(5,1fr); align-items:center; height:2.6rem}
  .cd-rail{position:absolute; left:10%; right:10%; top:50%; height:4px; margin-top:-2px; border-radius:2px;
    background:var(--line)}
  .cd-notch{position:relative; justify-self:center; width:2.1rem; height:2.1rem; border-radius:99px;
    border:2px solid var(--line); background:#fff; color:var(--slate); cursor:pointer;
    font-family:var(--mono); font-size:.72rem; font-weight:700; display:flex; align-items:center; justify-content:center;
    transition:transform .15s, border-color .15s, background-color .15s}
  .cd-notch:hover{border-color:var(--accent)}
  .cd-notch:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .cd-notch[aria-checked="true"]{border-color:var(--accent); background:var(--accent); color:#fff; transform:scale(1.12)}
  .cd-notch:disabled{cursor:default}
  .cd-notch.ref{border-color:var(--good); box-shadow:0 0 0 3px var(--good-soft)}
  .cd-notch.ref[aria-checked="false"]{color:var(--good)}
  /* Notches sit at 10/30/50/70/90%, so the end labels centre between 1 and 2, and between 4 and 5. */
  .cd-ends{position:relative; height:1rem; font-family:var(--mono); font-size:.6rem;
    letter-spacing:.06em; text-transform:uppercase; color:var(--slate); margin:.15rem 0 0}
  .cd-ends span{position:absolute; top:0; transform:translateX(-50%); white-space:nowrap}
  .cd-ends span:first-child{left:20%}
  .cd-ends span:last-child{left:80%}

  /* Feedback */
  .cd-verdict{font-size:.85rem; color:var(--slate); border-left:3px solid var(--accent);
    padding:.15rem 0 .15rem .7rem; margin:.9rem 0 0; max-width:38rem}
  .cd-verdict b{color:var(--ink)}
  .cd-verdict.good{border-left-color:var(--good)}
  .cd-verdict.bad{border-left-color:var(--warn)}
  .cd-notches{list-style:none; margin:.8rem 0 0; padding:0}
  .cd-n{display:grid; grid-template-columns:1.6rem 1fr; gap:.1rem .55rem; padding:.45rem .55rem; margin:0 0 .35rem;
    border:1px solid var(--line); border-radius:8px; font-size:.82rem; color:var(--slate); line-height:1.5; background:#fcfdfe}
  .cd-n.ref{border-color:#bfe0c8; background:var(--good-soft)}
  .cd-n.mine:not(.ref){border-color:#f0d9b8; background:var(--warn-soft)}
  .cd-n .k{font-family:var(--mono); font-size:.7rem; font-weight:700; color:var(--ink);
    width:1.5rem; height:1.5rem; border-radius:99px; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center}
  .cd-n .tg{font-family:var(--mono); font-size:.6rem; letter-spacing:.06em; text-transform:uppercase; font-weight:700; color:var(--ink)}
  .cd-n .mk{font-family:var(--mono); font-size:.6rem; letter-spacing:.06em; text-transform:uppercase; margin-left:.4rem}
  .cd-n .mk.r{color:var(--good)}
  .cd-n .mk.y{color:var(--warn)}
  .cd-n.ref .mk.y{color:var(--good)}
  .cd-n p{margin:.1rem 0 0}
  .cd-n q{font-family:var(--serif); color:var(--ink); quotes:"\201C" "\201D"}
  .cd-next{margin-top:.6rem; justify-content:flex-end}

  /* Summary */
  .cd-sum{list-style:none; margin:0; padding:0}
  .cd-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.2rem 1rem; align-items:center;
    padding:.5rem 0; border-top:1px dashed var(--line); font-size:.86rem}
  .cd-row:last-child{border-bottom:1px dashed var(--line)}
  .cd-row .nm b{display:block; font-weight:600}
  .cd-row .nm span{font-size:.78rem; color:var(--slate)}
  .cd-mini{display:flex; gap:.3rem}
  .cd-mini i{width:1.15rem; height:1.15rem; border-radius:99px; border:1.5px solid var(--line); background:#fff;
    font-style:normal; font-family:var(--mono); font-size:.55rem; font-weight:700; color:var(--slate);
    display:flex; align-items:center; justify-content:center}
  .cd-mini i.r{border-color:var(--good); box-shadow:0 0 0 2px var(--good-soft); color:var(--good)}
  .cd-mini i.y{background:var(--accent); border-color:var(--accent); color:#fff}
  .cd-mini i.y.r{background:var(--good); border-color:var(--good)}
  .cd-key{display:flex; flex-wrap:wrap; gap:.3rem 1rem; font-size:.74rem; color:var(--slate); margin:.5rem 0 0}
  .cd-key span{display:inline-flex; align-items:center; gap:.35rem}
  .cd-key i{width:.8rem; height:.8rem; border-radius:99px; display:inline-block; border:1.5px solid var(--line)}
  .cd-key i.y{background:var(--accent); border-color:var(--accent)}
  .cd-key i.r{border-color:var(--good); box-shadow:0 0 0 2px var(--good-soft)}
  @media (max-width:420px){ .cd-row{grid-template-columns:1fr} }

  @media (prefers-reduced-motion:reduce){ .cd-s,.cd-notch{transition:none} }
</style>
</head>
<body>

<div class="activity" id="cd">
  <div class="activity-instructions">
    <span class="a-instr">Each dial rewrites one verified finding, from saying nothing to saying too much.
    <strong>Set it where you would sign your name</strong>, using the evidence beside it.</span>
  </div>
  <div class="activity-body" id="cd-body"></div>
</div>

<script>
(function(){
  "use strict";
  const $ = (id)=>document.getElementById(id);

  /* Each dial runs from claiming least (1) to most (5). Within a finding the sentences share
     one shape, so the claim sits in the verb or the closing clause, not the length. The notches
     carry no names, and the reference moves with the reader and the evidence. */
  const FINDINGS = [
    {
      name:"30-day returns",
      audience:"the clinic board, deciding whether to explore a care-coordinator hire",
      ref:2,
      shows:[
        "<b>82</b> of <b>200</b> patients (<b>41%</b>) returned within 30 days at least once",
        "<b>114</b> visits were 30-day returns; <b>45</b> (<b>39.5%</b>) followed a visit flagged for follow-up",
        "<b>797</b> visits, 2022–2023, one clinic"
      ],
      not:[
        "Why any patient came back",
        "Whether care was left unresolved",
        "Whether a coordinator would change the rate"
      ],
      notches:[
        {t:"Repeat visits were common in 2022–2023.",
         why:"No number, nothing to check. The board can't weigh \"common\" against the cost of a hire."},
        {t:"41% of patients (82 of 200) had a return visit within 30 days.",
         why:"It leaves the board's question open: does this bear on the hire?"},
        {t:"41% of patients had a return visit within 30 days, which suggests care coordination is worth evaluating.",
         why:"The number and what it means for the board's decision. \"Suggests … worth evaluating\" is as far as a return rate can go."},
        {t:"41% of patients had a return visit within 30 days, indicating a need for a dedicated care coordinator.",
         why:"\"Indicating a need\" makes the board's decision for it. A return rate can't show that a coordinator would change it."},
        {t:"41% of patients had a return visit within 30 days, driven by gaps in care coordination.",
         why:"\"Driven by\" names a cause. The data shows that patients came back, not why."}
      ]
    },
    {
      name:"Uninsured patients",
      audience:"the county funder, asking whether the clinic serves uninsured patients",
      ref:1,
      shows:[
        "<b>19</b> of 200 patients (<b>9.5%</b>) had a visit recorded as Uninsured; <b>66</b> visits (<b>8.3%</b>)",
        "Self-Pay is its own category: <b>13</b> patients, <b>53</b> visits",
        "No patient has more than one insurance type recorded"
      ],
      not:[
        "The county's uninsured rate",
        "Whether Self-Pay patients lack coverage",
        "Anyone who never came to the clinic"
      ],
      notches:[
        {t:"The clinic serves a meaningful number of uninsured patients.",
         why:"\"Meaningful\" can't be checked. The funder needs a count it can verify."},
        {t:"19 patients (9.5%) had at least one visit recorded as uninsured.",
         why:"A count and a share the funder can check against its own records. That answers what they asked."},
        {t:"19 patients (9.5%) had at least one visit recorded as uninsured, roughly in line with the county's uninsured rate.",
         why:"It sounds modest, but there is no county rate anywhere in this data. The comparison is made up."},
        {t:"19 patients (9.5%) had at least one visit recorded as uninsured, demonstrating the clinic's role as a safety net for the county's uninsured.",
         why:"\"A safety net for the county\" is a claim about everyone uninsured in the county. The data only covers people who came in."},
        {t:"The clinic is the county's primary source of care for uninsured residents, serving 19 in 2022–2023.",
         why:"\"Primary source\" would need data on every other provider in the county. There is none."}
      ]
    },
    {
      name:"Missing county",
      audience:"the clinic director, deciding where a coordinator would start",
      ref:3,
      shows:[
        "County is blank on <b>243</b> of 797 visits (<b>30.5%</b>)",
        "<b>62</b> of 200 patients have no county on any visit",
        "Every county has <b>22</b> patients or fewer"
      ],
      not:[
        "Why county is missing",
        "Where the 62 patients live",
        "Which county needs a coordinator most"
      ],
      notches:[
        {t:"County data is incomplete.",
         why:"It doesn't say how incomplete, or what that means for placing a coordinator."},
        {t:"County is missing for 243 of 797 visits (30.5%).",
         why:"The director is deciding where to place someone, and this doesn't say what the gap means for that."},
        {t:"County is missing for 30.5% of visits (62 patients have none recorded), which suggests county comparisons may not be reliable.",
         why:"Closer, but it ends on a \"may\" and leaves the director without a next step."},
        {t:"County is missing for 30.5% of visits; we need to understand why before comparing counties.",
         why:"The gap is in the records themselves, so understanding it is a next step the data supports. It doesn't guess at a cause, or assume the gap is anyone's to fix."},
        {t:"County is missing for 30.5% of visits because intake staff skip the field.",
         why:"Nothing in the data says why county is missing. It could be intake, privacy rules, or walk-ins."}
      ]
    }
  ];

  let idx = 0;
  const picks = [0,0,0];
  const signed = [false,false,false];

  function progress(){
    return `<div class="cd-prog" aria-label="Finding ${Math.min(idx+1,3)} of 3">` + FINDINGS.map((f,i)=>
      `<span class="cd-pdot ${signed[i]?"done":""} ${i===idx?"now":""}"></span>`).join("") + `</div>`;
  }

  function render(){
    if(idx >= FINDINGS.length){ summary(); return; }
    const F = FINDINGS[idx], done = signed[idx], p = picks[idx];
    let h = `<div class="cd-stephead">
      <div class="lead">
        <p class="cd-step">Finding ${idx+1} of 3 · ${F.name}</p>
        <p class="cd-stepnote">For <b>${F.audience}</b>.</p>
      </div>${progress()}</div>`;

    h += `<div class="cd-ev"><p class="cd-evh">Evidence</p><div class="cd-evgrid">
      <div class="cd-evcol"><h4>What the data shows</h4><ul>${F.shows.map(s=>`<li>${s}</li>`).join("")}</ul></div>
      <div class="cd-evcol not"><h4>Not in the data</h4><ul>${F.not.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    </div></div>`;

    h += `<div class="cd-sent" aria-live="polite">${F.notches.map((n,i)=>
      `<p class="cd-s ${i===p?"on":""}" ${i===p?"":"aria-hidden=\"true\""}>${n.t}</p>`).join("")}</div>`;

    h += `<div class="cd-dial"><div class="cd-track" role="radiogroup" aria-label="How much the sentence claims, 1 least to 5 most">
      <span class="cd-rail" aria-hidden="true"></span>
      ${F.notches.map((n,i)=>`<button class="cd-notch ${done&&i===F.ref?"ref":""}" type="button" role="radio" data-i="${i}"
        aria-checked="${i===p}" tabindex="${i===p?0:-1}" aria-label="Notch ${i+1} of 5" ${done?"disabled":""}>${i+1}</button>`).join("")}
      </div><div class="cd-ends"><span>Claims less</span><span>Claims more</span></div></div>`;

    if(!done){
      h += `<div class="cd-stephead cd-next"><div class="lead"><p class="cd-stepnote">Try every notch. Then sign the one you would put your name to.</p></div>
        <button class="btn primary" id="cd-sign" type="button">Sign this sentence</button></div>`;
    } else {
      h += feedback(F, p);
      h += `<div class="cd-stephead cd-next"><div class="lead"></div>
        <button class="btn primary" id="cd-next" type="button">${idx<2?"Next finding":"See your three dials"}</button></div>`;
    }
    $("cd-body").innerHTML = h;
    wire();
  }

  function feedback(F, p){
    const n = F.notches[p];
    let cls, lead;
    if(p === F.ref){ cls = "good"; lead = "You signed the reference sentence."; }
    else if(p < F.ref){ cls = "bad"; lead = "Under-claimed: true, but it gives the reader less than the data can."; }
    else { cls = "bad"; lead = "Over-claimed: it says more than the evidence carries."; }
    let h = `<p class="cd-verdict ${cls}"><b>${lead}</b> ${n.why}`;
    if(p !== F.ref) h += ` The reference is notch ${F.ref+1}, marked green.`;
    h += `</p><ol class="cd-notches">`;
    F.notches.forEach((x,i)=>{
      const isRef = i===F.ref, isMine = i===p;
      h += `<li class="cd-n ${isRef?"ref":""} ${isMine?"mine":""}"><span class="k">${i+1}</span><div>
        ${isRef?`<span class="mk r">Reference</span>`:""}${isMine?`<span class="mk y">Yours</span>`:""}
        <p><q>${x.t}</q></p>${isMine?"":`<p>${x.why}</p>`}</div></li>`;
    });
    h += `</ol>`;
    return h;
  }

  function setPick(i, focus){
    if(signed[idx]) return;
    picks[idx] = i;
    document.querySelectorAll(".cd-notch").forEach(b=>{
      const on = +b.dataset.i === i;
      b.setAttribute("aria-checked", on); b.tabIndex = on ? 0 : -1;
      if(on && focus) b.focus();
    });
    document.querySelectorAll(".cd-s").forEach((s,k)=>{
      s.classList.toggle("on", k===i);
      if(k===i) s.removeAttribute("aria-hidden"); else s.setAttribute("aria-hidden","true");
    });
  }

  function wire(){
    document.querySelectorAll(".cd-notch").forEach(b=>{
      b.addEventListener("click", ()=>setPick(+b.dataset.i, false));
      b.addEventListener("keydown", e=>{
        const cur = picks[idx];
        let n = null;
        if(e.key==="ArrowRight"||e.key==="ArrowUp") n = Math.min(4,cur+1);
        else if(e.key==="ArrowLeft"||e.key==="ArrowDown") n = Math.max(0,cur-1);
        else if(e.key==="Home") n = 0;
        else if(e.key==="End") n = 4;
        if(n!==null){ e.preventDefault(); setPick(n, true); }
      });
    });
    const sign = $("cd-sign");
    if(sign) sign.addEventListener("click", ()=>{ signed[idx] = true; render(); const nx=$("cd-next"); if(nx) nx.focus({preventScroll:true}); });
    const next = $("cd-next");
    if(next) next.addEventListener("click", ()=>{ idx++; render(); const f=document.querySelector(".cd-notch[aria-checked='true'], #cd-restart"); if(f) f.focus({preventScroll:true}); });
  }

  function summary(){
    const hits = FINDINGS.filter((F,i)=>picks[i]===F.ref).length;
    const yours = picks.map(p=>p+1).join(" · "), refs = FINDINGS.map(F=>F.ref+1).join(" · ");
    let h = `<div class="cd-stephead"><div class="lead">
        <p class="cd-step">Your three dials</p>
        <p class="cd-stepnote">You set them at ${yours}. The reference is ${refs}.</p>
      </div>${progress()}</div><ul class="cd-sum">`;
    FINDINGS.forEach((F,i)=>{
      h += `<li class="cd-row"><div class="nm"><b>${F.name}</b><span>Yours: ${picks[i]+1}${picks[i]===F.ref?", the reference":" · reference: "+(F.ref+1)}</span></div>
        <div class="cd-mini" aria-label="Yours ${picks[i]+1}, reference ${F.ref+1}">${[0,1,2,3,4].map(k=>
          `<i class="${k===picks[i]?"y":""} ${k===F.ref?"r":""}">${k+1}</i>`).join("")}</div></li>`;
    });
    h += `</ul><div class="cd-key"><span><i class="y"></i>Yours</span><span><i class="r"></i>Reference</span></div>`;
    let v;
    if(hits===3) v = "<b>All three where the evidence puts them.</b> The right setting moved: interpret the return rate, report the headcount, recommend a fix for the missing counties. The dial is set by what the reader needs and what the evidence carries, not by a habit of sounding confident or cautious.";
    else {
      const over = FINDINGS.filter((F,i)=>picks[i]>F.ref).length, under = FINDINGS.filter((F,i)=>picks[i]<F.ref).length;
      v = `<b>${hits} of 3 where the evidence puts them${over&&!under?", and the misses ran high":(under&&!over?", and the misses ran low":"")}.</b> The right setting moved: interpret the return rate, report the headcount, recommend a fix for the missing counties. The dial is set by what the reader needs and what the evidence carries, not by a habit of sounding confident or cautious.`;
    }
    h += `<p class="cd-verdict">${v}</p>
      <div class="cd-stephead cd-next"><div class="lead"></div><button class="btn" id="cd-restart" type="button">Start over</button></div>`;
    $("cd-body").innerHTML = h;
    $("cd-restart").addEventListener("click", ()=>{
      idx = 0; picks.fill(0); signed.fill(false); render();
      const f = document.querySelector(".cd-notch"); if(f) f.focus();
    });
  }

  render();
})();
</script>

<script src="../assets/activity/embed.js"></script>

</body>
</html>
