<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="780" viewBox="0 0 1920 780">
  <rect width="1920" height="780" fill="#ffffff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .title{font-size:40px;font-weight:700;fill:#0B2F5B}
    .body{font-size:29px;fill:#173C72}
    .example-label{font-size:28px;font-weight:700;fill:#0B2F5B}
    .example{font-size:25px;fill:#173C72}
  </style>

  <!-- Constraint -->
  <rect x="25" y="24" width="605" height="725" rx="28" fill="#DCEEFF"/>
  <circle cx="328" cy="160" r="112" fill="#1586CC"/>
  <!-- barrier icon -->
  <line x1="282" y1="110" x2="282" y2="202" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
  <line x1="374" y1="110" x2="374" y2="202" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
  <rect x="270" y="126" width="116" height="50" rx="8" fill="#fff"/>
  <polygon points="279,137 300,137 282,165 270,165" fill="#1586CC"/>
  <polygon points="316,137 338,137 320,165 298,165" fill="#1586CC"/>
  <polygon points="354,137 377,137 359,165 337,165" fill="#1586CC"/>
  <text x="328" y="335" text-anchor="middle" class="title">Constraint</text>
  <text x="328" y="400" text-anchor="middle" class="body">
    <tspan x="328" dy="0">A constraint is a known boundary</tspan>
    <tspan x="328" dy="42">or condition the project must</tspan>
    <tspan x="328" dy="42">respect.</tspan>
  </text>
  <rect x="45" y="525" width="565" height="195" rx="22" fill="#CFE8FB"/>
  <text x="72" y="578" class="example-label">Example:</text>
  <text x="72" y="620" class="example">
    <tspan x="72" dy="0">The customer-retention team can</tspan>
    <tspan x="72" dy="36">review no more than 5,000 accounts</tspan>
    <tspan x="72" dy="36">each week.</tspan>
  </text>

  <!-- Assumption -->
  <rect x="657" y="24" width="605" height="725" rx="28" fill="#E2F3E8"/>
  <circle cx="960" cy="160" r="112" fill="#2E9A79"/>
  <!-- bulb -->
  <circle cx="960" cy="150" r="40" fill="#fff"/>
  <path d="M932 176 Q960 200 988 176 L980 205 H940 Z" fill="#fff"/>
  <rect x="947" y="205" width="26" height="18" rx="5" fill="#fff"/>
  <line x1="960" y1="90" x2="960" y2="72" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <line x1="918" y1="105" x2="905" y2="92" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <line x1="1002" y1="105" x2="1015" y2="92" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <line x1="902" y1="151" x2="884" y2="151" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <line x1="1018" y1="151" x2="1036" y2="151" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <text x="960" y="335" text-anchor="middle" class="title">Assumption</text>
  <text x="960" y="400" text-anchor="middle" class="body">
    <tspan x="960" dy="0">An assumption is something you</tspan>
    <tspan x="960" dy="42">are currently treating as true but</tspan>
    <tspan x="960" dy="42">have not yet verified.</tspan>
  </text>
  <rect x="677" y="525" width="565" height="195" rx="22" fill="#D6EFE2"/>
  <text x="704" y="578" class="example-label">Example:</text>
  <text x="704" y="620" class="example">
    <tspan x="704" dy="0">A Contract End Date of 2030-01-01</tspan>
    <tspan x="704" dy="36">means the account is still active.</tspan>
  </text>

  <!-- Risk -->
  <rect x="1289" y="24" width="605" height="725" rx="28" fill="#ECE6F8"/>
  <circle cx="1592" cy="160" r="112" fill="#7446B3"/>
  <!-- warning -->
  <polygon points="1592,92 1646,195 1538,195" fill="#fff"/>
  <line x1="1592" y1="126" x2="1592" y2="160" stroke="#7446B3" stroke-width="11" stroke-linecap="round"/>
  <circle cx="1592" cy="178" r="7" fill="#7446B3"/>
  <text x="1592" y="335" text-anchor="middle" class="title">Risk</text>
  <text x="1592" y="400" text-anchor="middle" class="body">
    <tspan x="1592" dy="0">A risk is something that might</tspan>
    <tspan x="1592" dy="42">happen or go wrong and could</tspan>
    <tspan x="1592" dy="42">reduce success or cause harm.</tspan>
  </text>
  <rect x="1309" y="525" width="565" height="195" rx="22" fill="#E5DAF4"/>
  <text x="1336" y="578" class="example-label">Example:</text>
  <text x="1336" y="620" class="example">
    <tspan x="1336" dy="0">Outreach could be sent to customers</tspan>
    <tspan x="1336" dy="36">who did not agree to receive</tspan>
    <tspan x="1336" dy="36">marketing messages.</tspan>
  </text>
</svg>