<svg xmlns="http://www.w3.org/2000/svg" width="1983" height="793" viewBox="0 0 1983 793">
  <rect width="1983" height="793" fill="#ffffff"/>
  <!-- connecting line -->
  <line x1="226" y1="224" x2="1750" y2="224" stroke="#aebdca" stroke-width="8" stroke-linecap="round"/>

  <!-- step circles -->
  <circle cx="228" cy="224" r="55" fill="#1f6f9f"/>
  <circle cx="679" cy="224" r="55" fill="#1f8f70"/>
  <circle cx="1138" cy="224" r="55" fill="#e58a0b"/>
  <circle cx="1611" cy="224" r="55" fill="#6f4aa8"/>

  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="middle">
    <text x="228" y="239">1</text>
    <text x="679" y="239">2</text>
    <text x="1138" y="239">3</text>
    <text x="1611" y="239">4</text>
  </g>

  <!-- titles -->
  <g fill="#112e4d" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="228" y="328" font-size="34">
      <tspan x="228" dy="0">The Evolving Role of</tspan>
      <tspan x="228" dy="42">the Data Practitioner</tspan>
    </text>
    <text x="679" y="328" font-size="34">
      <tspan x="679" dy="0">Context Is King</tspan>
      <tspan x="679" dy="42" font-size="28">Business, Organization,</tspan>
      <tspan x="679" dy="34" font-size="28">and Users</tspan>
    </text>
    <text x="1138" y="328" font-size="34">
      <tspan x="1138" dy="0">When AI Fails</tspan>
      <tspan x="1138" dy="42" font-size="28">Risks, Hallucinations, and</tspan>
      <tspan x="1138" dy="34" font-size="28">Silent Logic Bugs</tspan>
    </text>
    <text x="1611" y="328" font-size="34">
      <tspan x="1611" dy="0">Human-in-the-Loop</tspan>
      <tspan x="1611" dy="42">Decision Lab</tspan>
    </text>
  </g>

  <!-- descriptions -->
  <g fill="#36506a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="middle">
    <text x="228" y="457">
      <tspan x="228" dy="0">Explore how AI changes where</tspan>
      <tspan x="228" dy="34">you spend your time and attention.</tspan>
    </text>
    <text x="679" y="477">
      <tspan x="679" dy="0">See why technically correct analysis</tspan>
      <tspan x="679" dy="34">can still be wrong in the real world.</tspan>
    </text>
    <text x="1138" y="477">
      <tspan x="1138" dy="0">Learn how plausible AI-generated</tspan>
      <tspan x="1138" dy="34">work can still contain hidden errors.</tspan>
    </text>
    <text x="1611" y="457">
      <tspan x="1611" dy="0">Practice auditing AI-supported</tspan>
      <tspan x="1611" dy="34">data work before it informs a decision.</tspan>
    </text>
  </g>

  <!-- duration badges -->
  <rect x="114" y="544" rx="28" ry="28" width="235" height="56" fill="#dcebf7"/>
  <rect x="574" y="544" rx="28" ry="28" width="236" height="56" fill="#dcefe8"/>
  <rect x="1040" y="544" rx="28" ry="28" width="236" height="56" fill="#fbe6c6"/>
  <rect x="1517" y="544" rx="28" ry="28" width="236" height="56" fill="#e6ddf2"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <text x="232" y="580" fill="#1f6f9f">~45 minutes</text>
    <text x="692" y="580" fill="#1f8f70">~60 minutes</text>
    <text x="1158" y="580" fill="#c66c00">~60 minutes</text>
    <text x="1635" y="580" fill="#6f4aa8">~45 minutes</text>
  </g>
</svg>
