<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="768" viewBox="0 0 2048 768">
  <rect width="2048" height="768" fill="#ffffff"/>

  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #0b3568; }
    .body  { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 400; fill: #183f77; }
    .time  { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; }
    .num   { font-family: Arial, Helvetica, sans-serif; font-size: 48px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- connector -->
  <line x1="255" y1="148" x2="1835" y2="148" stroke="#aab8c7" stroke-width="8" stroke-linecap="round"/>

  <!-- numbered circles -->
  <circle cx="260" cy="148" r="68" fill="#2f83bd"/>
  <circle cx="780" cy="148" r="68" fill="#2e9a79"/>
  <circle cx="1305" cy="148" r="68" fill="#f08a1a"/>
  <circle cx="1838" cy="148" r="68" fill="#7b55bc"/>

  <text x="260" y="165" text-anchor="middle" class="num">1</text>
  <text x="780" y="165" text-anchor="middle" class="num">2</text>
  <text x="1305" y="165" text-anchor="middle" class="num">3</text>
  <text x="1838" y="165" text-anchor="middle" class="num">4</text>

  <!-- Part 1 -->
  <text x="260" y="268" text-anchor="middle" class="title">
    <tspan x="260" dy="0">Part 1: Creating and Auditing</tspan>
    <tspan x="260" dy="44">AI-Assisted Visualizations</tspan>
  </text>
  <text x="260" y="402" text-anchor="middle" class="body">
    <tspan x="260" dy="0">Use AI to create visualizations,</tspan>
    <tspan x="260" dy="38">then verify that they are accurate,</tspan>
    <tspan x="260" dy="38">clear, accessible, and faithful</tspan>
    <tspan x="260" dy="38">to the data.</tspan>
  </text>
  <rect x="100" y="570" width="320" height="74" rx="37" fill="#d7ecfb"/>
  <text x="260" y="617" text-anchor="middle" class="time" fill="#1f6da0">~60 minutes</text>

  <!-- Part 2 -->
  <text x="780" y="268" text-anchor="middle" class="title">
    <tspan x="780" dy="0">Part 2: Communicating Insights</tspan>
    <tspan x="780" dy="44">for Different Audiences</tspan>
  </text>
  <text x="780" y="402" text-anchor="middle" class="body">
    <tspan x="780" dy="0">Adapt visualizations, summaries,</tspan>
    <tspan x="780" dy="38">and dashboards to audience needs</tspan>
    <tspan x="780" dy="38">without going beyond the</tspan>
    <tspan x="780" dy="38">evidence.</tspan>
  </text>
  <rect x="620" y="570" width="320" height="74" rx="37" fill="#dff2e7"/>
  <text x="780" y="617" text-anchor="middle" class="time" fill="#268a6e">~60 minutes</text>

  <!-- Part 3 -->
  <text x="1305" y="268" text-anchor="middle" class="title">
    <tspan x="1305" dy="0">Part 3: Responsible AI</tspan>
    <tspan x="1305" dy="44">in Data Practice</tspan>
  </text>
  <text x="1305" y="402" text-anchor="middle" class="body">
    <tspan x="1305" dy="0">Examine accountability, privacy,</tspan>
    <tspan x="1305" dy="38">bias, authenticity, intellectual</tspan>
    <tspan x="1305" dy="38">property, regulation, and</tspan>
    <tspan x="1305" dy="38">environmental impacts.</tspan>
  </text>
  <rect x="1145" y="570" width="320" height="74" rx="37" fill="#fde4c8"/>
  <text x="1305" y="617" text-anchor="middle" class="time" fill="#ca6500">~60 minutes</text>

  <!-- Part 4 -->
  <text x="1838" y="268" text-anchor="middle" class="title">
    <tspan x="1838" dy="0">Part 4: Looking Ahead:</tspan>
    <tspan x="1838" dy="44">What Data Practitioners</tspan>
    <tspan x="1838" dy="44">See Coming</tspan>
  </text>
  <text x="1838" y="432" text-anchor="middle" class="body">
    <tspan x="1838" dy="0">Explore practitioner trends, then</tspan>
    <tspan x="1838" dy="38">bring the module together in a</tspan>
    <tspan x="1838" dy="38">final communication and</tspan>
    <tspan x="1838" dy="38">audit activity.</tspan>
  </text>
  <rect x="1678" y="570" width="320" height="74" rx="37" fill="#eadcf7"/>
  <text x="1838" y="617" text-anchor="middle" class="time" fill="#6d43a6">~45 minutes</text>
</svg>
